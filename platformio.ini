; Минимальный проект-стенд: собирает демо-прошивку — единственный,
; неизменный релиз-цель (Al-Zhilin/GitHubOTA-TestBed), на который
; накатываются examples библиотеки GitHubOTA при проверке на реальном
; железе. Сети не касается — только подтверждает свою валидность после
; OTA (см. src/main.cpp). Релиз собирается и публикуется вручную,
; отдельного CI больше нет.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson
    https://github.com/Al-Zhilin/GitHubOTA.git
