; Минимальный проект-стенд: собирает демо-прошивку, которая проверяет
; обновления в СВОЁМ ЖЕ репозитории (Al-Zhilin/GitHubOTA-TestBed).
; CI (.github/workflows/release.yml) собирает и публикует эту прошивку
; как релиз при каждом пуше тега — этим релизом и проверяются examples
; библиотеки GitHubOTA на реальном железе.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson
    https://github.com/Al-Zhilin/GitHubOTA.git
